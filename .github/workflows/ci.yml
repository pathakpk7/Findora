name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate --workspace=apps/backend

      - name: Run backend unit tests
        run: npm run test --workspace=apps/backend

      - name: Run frontend unit tests
        run: npm run test --workspace=apps/frontend

      - name: Build frontend
        run: npm run build --workspace=apps/frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start frontend (background)
        run: npm run start --workspace=apps/frontend & npx wait-on http://localhost:3000

      - name: Run Playwright E2E
        run: npm run test:e2e --workspace=apps/frontend

      - name: Build backend
        run: npm run build --workspace=apps/backend
